<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Outer Ring with Gold Border -->
  <circle cx="60" cy="60" r="58" fill="#006a4e" stroke="#d4af37" stroke-width="2.5" />
  <circle cx="60" cy="60" r="55.5" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />

  <!-- Inner Red Disc (Flag Red) -->
  <circle cx="60" cy="60" r="36" fill="#f42a41" stroke="#d4af37" stroke-width="1.8" />

  <!-- Center Official National Emblem in Gold -->
  <g transform="translate(60, 61) scale(0.65)" fill="#f7d000" stroke="#f7d000">
    <!-- Water Waves -->
    <path d="M-28,24 Q-14,20 0,24 Q14,28 28,24" fill="none" stroke-width="2.2" stroke-linecap="round" />
    <path d="M-22,29 Q-11,26 0,29 Q11,32 22,29" fill="none" stroke-width="1.8" stroke-linecap="round" />

    <!-- Water Lily (Shapla) Flower -->
    <!-- Base calyx -->
    <path d="M-12,18 Q0,21 12,18 Q8,15 0,16 Q-8,15 -12,18 Z" fill="#f7d000" stroke-width="0.5" />
    <!-- Center petal -->
    <path d="M0,17 C-5,8 -3,-6 0,-15 C3,-6 5,8 0,17 Z" fill="#ffd700" stroke="#d4af37" stroke-width="0.8" />
    <!-- Inner Left petal -->
    <path d="M-2,16 C-10,8 -12,-3 -9,-11 C-5,-2 -2,8 -2,16 Z" fill="#f7d000" stroke="#d4af37" stroke-width="0.8" />
    <!-- Inner Right petal -->
    <path d="M2,16 C10,8 12,-3 9,-11 C5,-2 2,8 2,16 Z" fill="#f7d000" stroke="#d4af37" stroke-width="0.8" />
    <!-- Outer Left petal -->
    <path d="M-4,17 C-18,12 -22,2 -18,-5 C-12,3 -4,11 -4,17 Z" fill="#f7d000" stroke="#d4af37" stroke-width="0.8" />
    <!-- Outer Right petal -->
    <path d="M4,17 C18,12 22,2 18,-5 C12,3 4,11 4,17 Z" fill="#f7d000" stroke="#d4af37" stroke-width="0.8" />

    <!-- Rice Sheaves / Ears of Paddy (Left & Right) -->
    <!-- Left Sheaf -->
    <path d="M-22,22 C-32,8 -32,-15 -20,-30 C-22,-20 -20,-5 -15,10" fill="none" stroke-width="2" stroke-linecap="round" />
    <circle cx="-27" cy="14" r="2" />
    <circle cx="-30" cy="5" r="2" />
    <circle cx="-31" cy="-4" r="2" />
    <circle cx="-29" cy="-13" r="2" />
    <circle cx="-25" cy="-22" r="2" />
    <circle cx="-20" cy="-30" r="1.8" />

    <!-- Right Sheaf -->
    <path d="M22,22 C32,8 32,-15 20,-30 C22,-20 20,-5 15,10" fill="none" stroke-width="2" stroke-linecap="round" />
    <circle cx="27" cy="14" r="2" />
    <circle cx="30" cy="5" r="2" />
    <circle cx="31" cy="-4" r="2" />
    <circle cx="29" cy="-13" r="2" />
    <circle cx="25" cy="-22" r="2" />
    <circle cx="20" cy="-30" r="1.8" />

    <!-- Three Connected Jute Leaves at Top -->
    <path d="M0,-24 C-3,-30 -2,-38 0,-43 C2,-38 3,-30 0,-24 Z" fill="#ffd700" stroke="#d4af37" stroke-width="0.8" />
    <path d="M-1,-25 C-7,-29 -11,-35 -11,-40 C-7,-37 -3,-31 -1,-25 Z" fill="#f7d000" stroke="#d4af37" stroke-width="0.8" />
    <path d="M1,-25 C7,-29 11,-35 11,-40 C7,-37 3,-31 1,-25 Z" fill="#f7d000" stroke="#d4af37" stroke-width="0.8" />

    <!-- Four 5-Pointed Stars (Two Left, Two Right) -->
    <!-- Left Stars -->
    <polygon points="-18,-38 -16.5,-34 -12,-34 -15.5,-31 -14,-27 -18,-29.5 -22,-27 -20.5,-31 -24,-34 -19.5,-34" fill="#ffd700" stroke="#d4af37" stroke-width="0.4" transform="scale(0.8) translate(-4, 0)" />
    <polygon points="-28,-34 -26.5,-30 -22,-30 -25.5,-27 -24,-23 -28,-25.5 -32,-23 -30.5,-27 -34,-30 -29.5,-30" fill="#ffd700" stroke="#d4af37" stroke-width="0.4" transform="scale(0.7) translate(-10, -2)" />

    <!-- Right Stars -->
    <polygon points="18,-38 16.5,-34 12,-34 15.5,-31 14,-27 18,-29.5 22,-27 20.5,-31 24,-34 19.5,-34" fill="#ffd700" stroke="#d4af37" stroke-width="0.4" transform="scale(0.8) translate(4, 0)" />
    <polygon points="28,-34 26.5,-30 22,-30 25.5,-27 24,-23 28,-25.5 32,-23 30.5,-27 34,-30 29.5,-30" fill="#ffd700" stroke="#d4af37" stroke-width="0.4" transform="scale(0.7) translate(10, -2)" />
  </g>

  <!-- Circular Text Path Definition (Upper Arc) -->
  <defs>
    <path id="upperArc" d="M 14,60 A 46,46 0 1,1 106,60" fill="none" />
    <path id="lowerArc" d="M 104,65 A 46,46 0 0,1 16,65" fill="none" />
  </defs>

  <!-- Curved Text: গণপ্রজাতন্ত্রী বাংলাদেশ সরকার -->
  <text font-family="'Hind Siliguri', 'SolaimanLipi', Arial, sans-serif" font-weight="bold" font-size="8.6" fill="#ffffff" letter-spacing="0.8">
    <textPath href="#upperArc" startOffset="50%" text-anchor="middle">
      গণপ্রজাতন্ত্রী বাংলাদেশ সরকার
    </textPath>
  </text>

  <!-- Bottom Four Stars in Gold -->
  <g fill="#ffd700" stroke="#d4af37" stroke-width="0.5">
    <!-- Star 1 -->
    <polygon points="41,101 42.5,97 46,97 43,94.5 44.5,91 41,93 37.5,91 39,94.5 36,97 39.5,97" transform="translate(0, 1) scale(0.8) translate(8, 18)" />
    <!-- Star 2 -->
    <polygon points="53,103 54.5,99 58,99 55,96.5 56.5,93 53,95 49.5,93 51,96.5 48,99 51.5,99" transform="translate(0, 1) scale(0.8) translate(12, 18)" />
    <!-- Star 3 -->
    <polygon points="67,103 68.5,99 72,99 69,96.5 70.5,93 67,95 63.5,93 65,96.5 62,99 65.5,99" transform="translate(0, 1) scale(0.8) translate(16, 18)" />
    <!-- Star 4 -->
    <polygon points="79,101 80.5,97 84,97 81,94.5 82.5,91 79,93 75.5,91 77,94.5 74,97 77.5,97" transform="translate(0, 1) scale(0.8) translate(20, 18)" />
  </g>
</svg>
